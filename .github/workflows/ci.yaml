name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-24.04

    env:
      FEDORA_VERSION: 44
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: getchblue
      IS_FROM_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=schedule,prefix=${{ env.FEDORA_VERSION }}-,pattern={{date 'YYYYMMDD'}}
            type=raw,value=${{ env.FEDORA_VERSION }},enable=${{ env.IS_FROM_MAIN }}
            type=raw,value=latest,enable=${{ env.IS_FROM_MAIN }}

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          AKMOD_KEY: ${{ secrets.AKMOD_KEY }}
        with:
          file: Containerfile
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          secret-envs: |
            AKMOD_KEY=AKMOD_KEY
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: ${{ env.COSIGN_KEY != '' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: ${{ env.COSIGN_KEY != '' }}
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          declare -a refs
          for tag in $TAGS; do
            refs+=("$tag@$DIGEST")
          done

          cosign sign \
            --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_KEY \
            "${refs[@]}"
